<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00355f"/>
      <stop offset="50%" stop-color="#004b87"/>
      <stop offset="100%" stop-color="#00213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00a5df"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Glowing Scanner ring / waves -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.2"/>

  <!-- Transit Ticket / Card in center -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="140" width="320" height="232" rx="24" fill="url(#cardGrad)"/>
    <!-- Card header strip -->
    <path d="M 96,164 C 96,150.745 106.745,140 120,140 L 392,140 C 405.255,140 416,150.745 416,164 L 416,192 L 96,192 Z" fill="#004b87"/>
    <!-- Card header mini text line -->
    <rect x="120" y="160" width="70" height="12" rx="6" fill="#38bdf8"/>
    <circle cx="388" cy="166" r="6" fill="#10b981"/>

    <!-- NFC Contactless Waves on Card -->
    <path d="M 330,240 A 30,30 0 0,1 330,280" fill="none" stroke="#004b87" stroke-width="6" stroke-linecap="round"/>
    <path d="M 344,228 A 50,50 0 0,1 344,292" fill="none" stroke="#004b87" stroke-width="6" stroke-linecap="round"/>
    <path d="M 358,216 A 70,70 0 0,1 358,304" fill="none" stroke="#004b87" stroke-width="6" stroke-linecap="round"/>

    <!-- QR/Barcode Graphic on Card -->
    <rect x="128" y="222" width="72" height="72" rx="10" fill="#004b87"/>
    <rect x="136" y="230" width="22" height="22" fill="#ffffff" rx="3"/>
    <rect x="142" y="236" width="10" height="10" fill="#004b87"/>
    <rect x="170" y="230" width="22" height="22" fill="#ffffff" rx="3"/>
    <rect x="176" y="236" width="10" height="10" fill="#004b87"/>
    <rect x="136" y="264" width="22" height="22" fill="#ffffff" rx="3"/>
    <rect x="142" y="270" width="10" height="10" fill="#004b87"/>
    <rect x="170" y="264" width="10" height="10" fill="#ffffff"/>
    <rect x="182" y="276" width="10" height="10" fill="#ffffff"/>

    <!-- Ticket checkmark / valid indicator -->
    <circle cx="256" cy="256" r="32" fill="#10b981"/>
    <path d="M 244,256 L 253,265 L 268,247" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Card bottom label "KÅLLE" -->
    <text x="128" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#004b87" letter-spacing="1.5">KÅLLE VÄSTTRAFIK</text>
  </g>
</svg>
